name: Daily Horizon Summary

on:
  schedule:
    # GitHub Actions schedules use UTC; 14:00 UTC is 22:00 Asia/Shanghai.
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync --extra openbb

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Setup subscribers
        run: echo '${{ secrets.HORIZON_SUBSCRIBERS }}' > data/subscribers.json

      - name: Run Horizon
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          HORIZON_EMAIL: ${{ secrets.HORIZON_EMAIL }}
          INFOQ_TOKEN: ${{ secrets.INFOQ_TOKEN }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
